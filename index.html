<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projects Zine</title>

<style>

:root {
    --paper: #f2eee4;
    --page-gap: 18px;
    --flip-speed: 500ms;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

.zine {
    width: 100%;
    max-width: 1250px;
    margin: 0 auto;
    padding: 20px 40px;
}

.viewer {
    position: relative;

    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 2500px;
}

.book {
    position: relative;

    width: min(100%, 1080px);

    aspect-ratio: 2.03 / 1;

    transform-style: preserve-3d;
}

.spread {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: var(--page-gap);

    transform-style: preserve-3d;

    backface-visibility: hidden;

    will-change:
        transform,
        opacity,
        filter;
}

.page {
    position: relative;

    height: 100%;
    aspect-ratio: 1 / 1;

    flex: 0 0 auto;

    overflow: hidden;

    background: var(--paper);

    box-shadow:
        0 14px 34px rgba(0,0,0,.13);

    border-radius: 2px;
}

.page img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background: var(--paper);

    user-select: none;
    pointer-events: none;
}

.page.left::after {
    content: "";

    position: absolute;

    right: 0;
    top: 0;
    bottom: 0;

    width: 5%;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.09),
            transparent
        );
}

.page.right::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 5%;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.09),
            transparent
        );
}

.spread.single {
    justify-content: center;
}

.spread.single .page {
    height: 100%;
    aspect-ratio: 1 / 1;

    box-shadow:
        0 18px 42px rgba(0,0,0,.16);
}

.spread.single .page::before,
.spread.single .page::after {
    display: none;
}

/* PAGE FLIP */

.flip-out-next {
    animation:
        flipOutNext
        var(--flip-speed)
        cubic-bezier(.55,.03,.28,.98)
        forwards;

    z-index: 10;
}

.flip-in-next {
    animation:
        flipInNext
        var(--flip-speed)
        cubic-bezier(.55,.03,.28,.98)
        forwards;

    z-index: 5;
}

@keyframes flipOutNext {

    0% {
        transform:
            rotateY(0deg)
            translateX(0);

        opacity: 1;

        filter:
            brightness(1);
    }

    45% {
        transform:
            rotateY(-35deg)
            translateX(-1%);

        filter:
            brightness(.91);
    }

    100% {
        transform:
            rotateY(-91deg)
            translateX(-3%);

        opacity: 0;

        filter:
            brightness(.72);
    }
}

@keyframes flipInNext {

    0% {
        transform:
            rotateY(62deg)
            translateX(3%);

        opacity: 0;

        filter:
            brightness(.78);
    }

    100% {
        transform:
            rotateY(0deg)
            translateX(0);

        opacity: 1;

        filter:
            brightness(1);
    }
}

/* ERROR DISPLAY */

.image-error {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 8px;

    padding: 25px;

    text-align: center;

    background: #f2eee4;

    font-size: 13px;

    color: #9d1520;
}

.image-error strong {
    color: #111;
}

/* MOBILE */

@media (max-width: 800px) {

    :root {
        --page-gap: 8px;
    }

    .zine {
        padding: 12px 20px;
    }

    .book {
        width: 100%;
    }
}

@media (prefers-reduced-motion: reduce) {

    .flip-out-next,
    .flip-in-next {
        animation-duration: 1ms !important;
    }
}

</style>
</head>

<body>

<main class="zine">

    <section
        class="viewer"
        aria-label="Projects zine"
    >

        <div
            class="book"
            id="zineBook"
        ></div>

    </section>

</main>

<script>

/* YOUR FILES */

const pages = [

    "1.png",
    "2.png",
    "3.png",
    "4.png",
    "5.png",
    "6.png",
    "7.png",
    "8.png",
    "9.png",
    "10.png",
    "11.png",
    "12.png"

];


/* MAGAZINE ORDER */

const spreads = [

    [pages[0]],

    [
        pages[1],
        pages[2]
    ],

    [
        pages[3],
        pages[4]
    ],

    [
        pages[5],
        pages[6]
    ],

    [
        pages[7],
        pages[8]
    ],

    [
        pages[9],
        pages[10]
    ],

    [pages[11]]

];


/* SETTINGS */

const AUTO_FLIP_DELAY = 6000;

const FLIP_DURATION = 800;


const book =
    document.getElementById(
        "zineBook"
    );


let currentSpread = 0;

let locked = false;


/* CREATE PAGE */

function createPage(
    imagePath,
    side = ""
) {

    const page =
        document.createElement(
            "div"
        );


    page.className =
        "page " + side;


    const image =
        document.createElement(
            "img"
        );


    image.src =
        imagePath;


    image.alt =
        "Projects zine page";


    image.onerror =
        function () {

            console.error(
                "Missing file:",
                imagePath
            );


            page.innerHTML = `
                <div class="image-error">

                    <strong>
                        Missing image
                    </strong>

                    <span>
                        ${imagePath}
                    </span>

                </div>
            `;

        };


    page.appendChild(
        image
    );


    return page;

}


/* CREATE SPREAD */

function createSpread(
    spreadData
) {

    const spread =
        document.createElement(
            "div"
        );


    if (
        spreadData.length === 1
    ) {

        spread.className =
            "spread single";


        spread.appendChild(

            createPage(
                spreadData[0]
            )

        );

    }


    if (
        spreadData.length === 2
    ) {

        spread.className =
            "spread double";


        spread.appendChild(

            createPage(
                spreadData[0],
                "left"
            )

        );


        spread.appendChild(

            createPage(
                spreadData[1],
                "right"
            )

        );

    }


    return spread;

}


/* FIRST PAGE */

function renderInitial() {

    book.innerHTML = "";


    book.appendChild(

        createSpread(
            spreads[
                currentSpread
            ]
        )

    );

}


/* NEXT SPREAD */

function nextSpread() {

    if (locked) {
        return;
    }


    locked = true;


    let nextIndex =
        currentSpread + 1;


    if (
        nextIndex >=
        spreads.length
    ) {

        nextIndex = 0;

    }


    const oldSpread =
        book.querySelector(
            ".spread"
        );


    const newSpread =
        createSpread(
            spreads[
                nextIndex
            ]
        );


    book.appendChild(
        newSpread
    );


    oldSpread.classList.add(
        "flip-out-next"
    );


    newSpread.classList.add(
        "flip-in-next"
    );


    currentSpread =
        nextIndex;


    setTimeout(
        () => {

            oldSpread.remove();


            newSpread.className =
                "spread " +
                (
                    spreads[
                        currentSpread
                    ].length === 1

                    ? "single"

                    : "double"
                );


            locked = false;

        },

        FLIP_DURATION + 80

    );

}


/* PRELOAD */

pages.forEach(
    path => {

        const image =
            new Image();

        image.src =
            path;

    }
);


/* START */

renderInitial();


setInterval(
    nextSpread,
    AUTO_FLIP_DELAY
);

</script>

</body>
</html>
